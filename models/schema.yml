crversion: 2

sources:
  - name: raw
    schema: gz_raw_data_2
    description: greenweez data source 
    tables:

      - name: sales
        identifier: raw_gz_sales
        description: sales of greenweez
        columns:
          - name: "(orders_id || '-' || pdt_id)"
            description: primary key of sales table
            tests:
              - unique
              - not_null
          
      - name: product
        identifier: raw_gz_product
        description: list of product and their price 
        columns:
          - name: products_id 
            description: primary key of product table
            tests:
              - unique
              - not_null

      - name: ship
        identifier: raw_gz_ship 
        description: list of orders with ship costs 
        columns:
          - name: orders_id 
            description: primary key
            tests:
              - unique
              - not_null
  
#intermediate models

models:
  - name: int_sales_margin
    description: marge dégagé pour chaque produits et commandes
    columns:
      - name: "(orders_id || '-' || products_id)"
        description: primary key de la table
        tests:
          - unique
          - not_null

  - name: int_order_margin
    description: kpi par commande et par date
    columns:
      - name: orders_id 
        description: primary key de la table
        tests:
          - not_null
          - unique
      - name: date_date
        description: date d'achat de la commande
        tests:
          - not_null
      - name: revenue 
        description: chiffre d'affaires par commande
        tests:
          - not_null
      - name: quantity
        description: quantité de produits par commande 
        tests:
          - not_null
      - name: purchase_cost
        description: prix d'achat d'une commande
        tests:
          - not_null
      - name: margin
        description: marge dégagée par commande
        tests:
          - not_null
  - name: int_orders_operational
    description: kpi opérationnels par commande et par date
    columns:
      - name: orders_id 
        description: primary key de la table
        tests:
          - not_null
          - unique
      - name: date_date
        description: date d'achat de la commande
        tests:
          - not_null
      - name: revenue 
        description: chiffre d'affaires par commande
        tests:
          - not_null
      - name: margin
        description: marge dégagée par commande
        tests:
          - not_null
      - name: operational_margin
        description: marge opérationnelle - sans les couts liés au transport - par commande
        tests:
          - not_null
      - name: purchase_cost
        description: prix d'achat d'une commande
        tests:
          - not_null
      - name: log_cost
        description: coût logistique par commande pour Greenweez
        tests:
          - not_null
      - name: shipping_cost
        description: frais de transport par commande pour Greenweez
        tests:
          - not_null
      - name: quantity
        description: quantité de produits par commande 
        tests:
          - not_null